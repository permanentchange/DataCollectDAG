output:
  root_dir: ~/DATA_COLLECT
calibration:
  path: demo/calibration/cali.json
ros:
  node_name: data_collect_dag
  control:
    control_topic: /data_collect/control
    status_topic: /data_collect/status
  topics:
    front_wide_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image2
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: front_wide_camera
    front_fisheye_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image4
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: front_fisheye_camera
    rear_fisheye_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image5
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: rear_fisheye_camera
    left_fisheye_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image6
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: left_fisheye_camera
    right_fisheye_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image7
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: right_fisheye_camera
    top_lidar:
      topic: /rslidar_points
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: top_lidar
    front_right_lidar:
      topic: /livox/lidar_rf
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: front_right_lidar
    rear_right_lidar:
      topic: /livox/lidar_rb
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: rear_right_lidar
    front_left_lidar:
      topic: /livox/lidar_lf
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: front_left_lidar
    rear_left_lidar:
      topic: /livox/lidar_lb
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: rear_left_lidar
    imu:
      topic: /imu/data
      msg_type: sensor_msgs/Imu
      role: imu
      sensor_name: imu
    bdstar_nmea:
      topic: /bdstar/nmea_sentence
      msg_type: bdstar/string
      role: nmea
      sensor_name: bdstar
    odom:
      topic: /odom
      msg_type: nav_msgs/Odometry
      role: odometry
      sensor_name: odom
    localization:
      topic: /localization
      msg_type: igv_msgs/location
      role: localization
      sensor_name: localization
cache:
  defaults_by_role:
    image:
      max_frames: 10
      max_age_sec: 1.0
    pointcloud:
      max_frames: 10
      max_age_sec: 1.0
    imu:
      max_frames: 200
      max_age_sec: 1.0
    nmea:
      max_frames: 10
      max_age_sec: 1.0
    odometry:
      max_frames: 50
      max_age_sec: 1.0
    localization:
      max_frames: 200
      max_age_sec: 1.0
  topic_overrides:
    front_wide_camera:
      max_frames: 5
      max_age_sec: 1.0
runtime:
  debug: true
  sample_workers: 1
  node_workers: 2
  main_frame_queue_size: 3
  main_frame_delay_ms: 50
  stop_timeout_sec: 2.0
pipelines:
  init:
    description: Defualt trivial pipeline.
    main_source: front_wide_camera
    stop_conditions:
      max_duration_sec: 2
    nodes:
      - node_id: start
        type: start
      - node_id: fps_control_guard
        type: fps_guard
        config:
          gate_id: saved_sample_fps
          max_fps: 1.0
      - node_id: front_yolo_gate
        type: yolo_gate
        inputs:
          image: main_frame
        config:
          model_path: demo/models/yolo26m.pt
          class_names:
            - person
            - car
          confidence_thresholds:
            - 0.00025
            - 0.00025
          min_area_ratios:
            - 0.00001
            - 0.00001
          predict_conf: 0.00025
          device: cpu
          imgsz: 640
          failure_policy: skip_sample
      - node_id: sync_top_lidar
        type: time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          matched_frame: top_lidar_synced
        config:
          source: top_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_corner_lidars
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_left_lidar: front_left_lidar
          front_right_lidar: front_right_lidar
          rear_left_lidar: rear_left_lidar
          rear_right_lidar: rear_right_lidar
        config:
          sources:
            - front_left_lidar
            - front_right_lidar
            - rear_left_lidar
            - rear_right_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_fisheye_images
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_fisheye_camera: front_fisheye_camera
          rear_fisheye_camera: rear_fisheye_camera
          left_fisheye_camera: left_fisheye_camera
          right_fisheye_camera: right_fisheye_camera
        config:
          sources:
            - front_fisheye_camera
            - rear_fisheye_camera
            - left_fisheye_camera
            - right_fisheye_camera
          strategy: nearest
          max_time_diff_ms: 10
          wait_timeout_ms: 150
          required: true
      - node_id: top_lidar_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: top_lidar_synced
          reference_frame: main_frame
        outputs:
          pointcloud: top_lidar_compensated
        config:
          sensor_topic: /rslidar_points
          localization_source: localization
          pose_wait_timeout_ms: 200
          required: true
          use_base_frame: true
      - node_id: front_left_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: front_left_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: front_left_compensated
        config:
          sensor_topic: /livox/lidar_lf
          localization_source: localization
          pose_wait_timeout_ms: 100
          required: true
          use_base_frame: true
      - node_id: front_right_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: front_right_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: front_right_compensated
        config:
          sensor_topic: /livox/lidar_rf
          localization_source: localization
          pose_wait_timeout_ms: 100
          required: true
          use_base_frame: true
      - node_id: rear_left_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: rear_left_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: rear_left_compensated
        config:
          sensor_topic: /livox/lidar_lb
          localization_source: localization
          pose_wait_timeout_ms: 100
          required: true
          use_base_frame: true
      - node_id: rear_right_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: rear_right_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: rear_right_compensated
        config:
          sensor_topic: /livox/lidar_rb
          localization_source: localization
          pose_wait_timeout_ms: 100
          required: true
          use_base_frame: true
      - node_id: aggregate_pointclouds
        type: aggregate_pointclouds
        outputs:
          pointcloud: aggregated_pointcloud
        config:
          required_inputs:
            - top_lidar_compensated
          optional_inputs:
            - front_left_compensated
            - front_right_compensated
            - rear_left_compensated
            - rear_right_compensated
      - node_id: save_xtreme1
        type: xtreme1_structured_save
        inputs:
          pointcloud: aggregated_pointcloud
          camera_0: main_frame
          camera_1: front_fisheye_camera
          camera_2: rear_fisheye_camera
          camera_3: left_fisheye_camera
          camera_4: right_fisheye_camera
        config:
          dataset_name: collect_demo
          cameras:
            - input_name: camera_0
              topic_key: front_wide_camera
            - input_name: camera_1
              topic_key: front_fisheye_camera
            - input_name: camera_2
              topic_key: rear_fisheye_camera
            - input_name: camera_3
              topic_key: left_fisheye_camera
            - input_name: camera_4
              topic_key: right_fisheye_camera
      - node_id: fps_control_marker
        type: fps_marker
        config:
          gate_id: saved_sample_fps
      - node_id: end
        type: end
    edges:
      - [start, fps_control_guard]
      - [fps_control_guard, front_yolo_gate]
      - [front_yolo_gate, sync_top_lidar]
      - [front_yolo_gate, sync_corner_lidars]
      - [front_yolo_gate, sync_fisheye_images]
      - [sync_top_lidar, top_lidar_motion]
      - [top_lidar_motion, aggregate_pointclouds]
      - [sync_corner_lidars, front_left_motion]
      - [front_left_motion, aggregate_pointclouds]
      - [sync_corner_lidars, front_right_motion]
      - [front_right_motion, aggregate_pointclouds]
      - [sync_corner_lidars, rear_left_motion]
      - [rear_left_motion, aggregate_pointclouds]
      - [sync_corner_lidars, rear_right_motion]
      - [rear_right_motion, aggregate_pointclouds]
      - [sync_fisheye_images, save_xtreme1]
      - [aggregate_pointclouds, save_xtreme1]
      - [save_xtreme1, fps_control_marker]
      - [fps_control_marker, end]

