  fps_with_yolo:
    description: Save data based on yolo detection results.
    main_source: front_ext_camera
    topics:
      - front_ext_camera
      - front_camera
      - rear_camera
      - left_camera
      - right_camera
      - top_lidar
      - front_right_lidar
      - rear_right_lidar
      - front_left_lidar
      - rear_left_lidar
      - imu
      - bdstar_nmea
      - odom
      - localization
    time_delay_ms: 500
    stop_conditions:
      max_duration_sec: 6000
    nodes:
      - node_id: start
        type: start
      - node_id: fps_guard
        type: fps_guard
        config:
          gate_id: saved_sample_fps
          max_fps: 1.0
      - node_id: front_camera_yolo_gate
        type: yolo_gate
        inputs:
          image: front_camera
        config:
          model_path: demo/models/yolo26m.pt
          class_names:
            - bicycle
            - electric_bicycle  # 电动车：需自定义模型标签
            - motorcycle        # 当前 COCO 模型可识别
            - person            # 当前 COCO 模型可识别
            - tricycle
            - traffic_cone
            - trash_can
            - bollard
            - cat
            - dog
            - horse
          confidence_thresholds:
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
            - 0.25
          min_area_ratios:
            - 0.0002    # bicycle
            - 0.0002    # electric_bicycle
            - 0.0003    # motorcycle
            - 0.00015   # person
            - 0.00015   # tricycle
            - 0.00003   # traffic_cone
            - 0.00005   # trash_can
            - 0.00003   # bollard
            - 0.00003   # cat
            - 0.00008   # dog
            - 0.00015   # horse
          predict_conf: 0.2
          device: gpu
          imgsz: 640
          failure_policy: skip_sample
      - node_id: sync_top_lidar
        type: time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          matched_frame: top_lidar_synced
        config:
          source: top_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_corner_lidars
        type: multi_time_sync
        inputs:
          reference_frame: top_lidar_synced
        outputs:
          front_left_lidar: front_left_lidar
          front_right_lidar: front_right_lidar
          rear_left_lidar: rear_left_lidar
          rear_right_lidar: rear_right_lidar
        config:
          sources:
            - front_left_lidar
            - front_right_lidar
            - rear_left_lidar
            - rear_right_lidar
          strategy: nearest
          max_time_diff_ms: 20
          wait_timeout_ms: 400
          required: true
      - node_id: sync_images
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_camera: front_camera
          rear_camera: rear_camera
          left_camera: left_camera
          right_camera: right_camera
        config:
          sources:
            - front_camera
            - rear_camera
            - left_camera
            - right_camera
          strategy: nearest
          max_time_diff_ms: 20
          wait_timeout_ms: 400
          required: true
      - node_id: undistort_front_ext
        type: image_undistort
        inputs:
          image: main_frame
        outputs:
          image: front_ext_camera_undistorted
        config:
          source: front_ext_camera
          write_debug_artifacts: false
      - node_id: undistort_front
        type: image_undistort
        inputs:
          image: front_camera
        outputs:
          image: front_camera_undistorted
        config:
          source: front_camera
          write_debug_artifacts: false
      - node_id: undistort_rear
        type: image_undistort
        inputs:
          image: rear_camera
        outputs:
          image: rear_camera_undistorted
        config:
          source: rear_camera
          write_debug_artifacts: false
      - node_id: undistort_left
        type: image_undistort
        inputs:
          image: left_camera
        outputs:
          image: left_camera_undistorted
        config:
          source: left_camera
