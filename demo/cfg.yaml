  compare_motion:
    description: Save data on target fps.
    main_source: front_ext_camera
    topics:
      - front_ext_camera
      - front_camera
      - rear_camera
      - left_camera
      - right_camera
      - top_lidar
      - front_right_lidar
      - rear_right_lidar
      - front_left_lidar
      - rear_left_lidar
      - imu
      - bdstar_nmea
      - odom
      - localization
    time_delay_ms: 500
    stop_conditions:
      max_duration_sec: 6000
    nodes:
      - node_id: start
        type: start
      - node_id: fps_guard
        type: fps_guard
        config:
          gate_id: saved_sample_fps
          max_fps: 1.0
      - node_id: sync_top_lidar
        type: time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          matched_frame: top_lidar_synced
        config:
          source: top_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_corner_lidars
        type: multi_time_sync
        inputs:
          reference_frame: top_lidar_synced
        outputs:
          front_left_lidar: front_left_lidar
          front_right_lidar: front_right_lidar
          rear_left_lidar: rear_left_lidar
          rear_right_lidar: rear_right_lidar
        config:
          sources:
            - front_left_lidar
            - front_right_lidar
            - rear_left_lidar
            - rear_right_lidar
          strategy: nearest
          max_time_diff_ms: 20
          wait_timeout_ms: 400
          required: true
