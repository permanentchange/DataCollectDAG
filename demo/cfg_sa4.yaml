output:
  root_dir: ~/DATA_COLLECT
calibration:
  path: demo/calibration/sa4_cali.json
ros:
  node_name: data_collect_dag
  control:
    control_topic: /data_collect/control
    status_topic: /data_collect/status
  topics:
    front_ext_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image2
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: front_ext_camera
    front_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image4
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: front_camera
    rear_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image5
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: rear_camera
    left_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image6
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: left_camera
    right_camera:
      topic: /miivii_gmsl_camera_node/miivii_gmsl/image7
      msg_type: sensor_msgs/Image
      role: image
      sensor_name: right_camera
    top_lidar:
      topic: /rslidar_points
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: top_lidar
    front_right_lidar:
      topic: /livox/lidar_rf
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: front_right_lidar
    rear_right_lidar:
      topic: /livox/lidar_rb
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: rear_right_lidar
    front_left_lidar:
      topic: /livox/lidar_lf
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: front_left_lidar
    rear_left_lidar:
      topic: /livox/lidar_lb
      msg_type: sensor_msgs/PointCloud2
      role: pointcloud
      sensor_name: rear_left_lidar
    imu:
      topic: /imu/data
      msg_type: sensor_msgs/Imu
      role: imu
      sensor_name: imu
    bdstar_nmea:
      topic: /bdstar/nmea_sentence
      msg_type: bdstar/string
      role: nmea
      sensor_name: bdstar
    odom:
      topic: /odom
      msg_type: nav_msgs/Odometry
      role: odometry
      sensor_name: odom
    localization:
      topic: /localization
      msg_type: igv_msgs/location
      role: localization
      sensor_name: localization
cache:
  defaults_by_role:
    image:
      max_frames: 10
      max_age_sec: 1.0
    pointcloud:
      max_frames: 20
      max_age_sec: 2.0
    imu:
      max_frames: 400
      max_age_sec: 2.0
    nmea:
      max_frames: 20
      max_age_sec: 2.0
    odometry:
      max_frames: 100
      max_age_sec: 2.0
    localization:
      max_frames: 400
      max_age_sec: 2.0
runtime:
  debug: true
  sample_workers: 1
  node_workers: 4
  main_frame_queue_size: 2
  main_frame_delay_ms: 20
  stop_timeout_sec: 1.0
pipelines:
  init:
    description: Check topics.
    main_source: front_ext_camera
    topics:
      - front_ext_camera
      - front_camera
      - rear_camera
      - left_camera
      - right_camera
      - top_lidar
      - front_right_lidar
      - rear_right_lidar
      - front_left_lidar
      - rear_left_lidar
      - imu
      - bdstar_nmea
      - odom
      - localization
    time_delay_ms: 500
    stop_conditions:
      max_duration_sec: 2
    nodes:
      - node_id: start
        type: start
      - node_id: sync_top_lidar
        type: time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          matched_frame: top_lidar_synced
        config:
          source: top_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_corner_lidars
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_left_lidar: front_left_lidar
          front_right_lidar: front_right_lidar
          rear_left_lidar: rear_left_lidar
          rear_right_lidar: rear_right_lidar
        config:
          sources:
            - front_left_lidar
            - front_right_lidar
            - rear_left_lidar
            - rear_right_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_images
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_camera: front_camera
          rear_camera: rear_camera
          left_camera: left_camera
          right_camera: right_camera
        config:
          sources:
            - front_camera
            - rear_camera
            - left_camera
            - right_camera
          strategy: nearest
          max_time_diff_ms: 10
          wait_timeout_ms: 150
          required: true
      - node_id: end
        type: end
    edges:
      - [start, sync_top_lidar]
      - [start, sync_corner_lidars]
      - [start, sync_images]
      - [sync_top_lidar, end]
      - [sync_corner_lidars, end]
      - [sync_images, end]
  fps:
    description: Save data on target fps.
    main_source: front_ext_camera
    topics:
      - front_ext_camera
      - front_camera
      - rear_camera
      - left_camera
      - right_camera
      - top_lidar
      - front_right_lidar
      - rear_right_lidar
      - front_left_lidar
      - rear_left_lidar
      - imu
      - bdstar_nmea
      - odom
      - localization
    time_delay_ms: 500
    stop_conditions:
      max_duration_sec: 6000
    nodes:
      - node_id: start
        type: start
      - node_id: fps_guard
        type: fps_guard
        config:
          gate_id: saved_sample_fps
          max_fps: 1.0
      - node_id: sync_top_lidar
        type: time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          matched_frame: top_lidar_synced
        config:
          source: top_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_corner_lidars
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_left_lidar: front_left_lidar
          front_right_lidar: front_right_lidar
          rear_left_lidar: rear_left_lidar
          rear_right_lidar: rear_right_lidar
        config:
          sources:
            - front_left_lidar
            - front_right_lidar
            - rear_left_lidar
            - rear_right_lidar
          strategy: nearest
          max_time_diff_ms: 50
          wait_timeout_ms: 400
          required: true
      - node_id: sync_images
        type: multi_time_sync
        inputs:
          reference_frame: main_frame
        outputs:
          front_camera: front_camera
          rear_camera: rear_camera
          left_camera: left_camera
          right_camera: right_camera
        config:
          sources:
            - front_camera
            - rear_camera
            - left_camera
            - right_camera
          strategy: nearest
          max_time_diff_ms: 20
          wait_timeout_ms: 400
          required: true
      - node_id: top_lidar_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: top_lidar_synced
          reference_frame: main_frame
        outputs:
          pointcloud: top_lidar_compensated
        config:
          sensor_topic: /rslidar_points
          localization_source: localization
          pose_wait_timeout_ms: 400
          required: true
          use_base_frame: true
      - node_id: front_left_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: front_left_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: front_left_compensated
        config:
          sensor_topic: /livox/lidar_lf
          localization_source: localization
          pose_wait_timeout_ms: 400
          required: true
          use_base_frame: true
      - node_id: front_right_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: front_right_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: front_right_compensated
        config:
          sensor_topic: /livox/lidar_rf
          localization_source: localization
          pose_wait_timeout_ms: 400
          required: true
          use_base_frame: true
      - node_id: rear_left_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: rear_left_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: rear_left_compensated
        config:
          sensor_topic: /livox/lidar_lb
          localization_source: localization
          pose_wait_timeout_ms: 400
          required: true
          use_base_frame: true
      - node_id: rear_right_motion
        type: pointcloud_motion_compensation
        inputs:
          pointcloud: rear_right_lidar
          reference_frame: main_frame
        outputs:
          pointcloud: rear_right_compensated
        config:
          sensor_topic: /livox/lidar_rb
          localization_source: localization
          pose_wait_timeout_ms: 400
          required: true
          use_base_frame: true
      - node_id: aggregate_pointclouds
        type: aggregate_pointclouds
        outputs:
          pointcloud: aggregated_pointcloud
        config:
          required_inputs:
            - top_lidar_compensated
            - front_left_compensated
            - front_right_compensated
            - rear_left_compensated
            - rear_right_compensated
      - node_id: save_xtreme1
        type: xtreme1_structured_save
        inputs:
          pointcloud: aggregated_pointcloud
          camera_0: main_frame
          camera_1: front_camera
          camera_2: rear_camera
          camera_3: left_camera
          camera_4: right_camera
        config:
          dataset_name: collect_demo
          cameras:
            - input_name: camera_0
              topic_key: front_ext_camera
            - input_name: camera_1
              topic_key: front_camera
            - input_name: camera_2
              topic_key: rear_camera
            - input_name: camera_3
              topic_key: left_camera
            - input_name: camera_4
              topic_key: right_camera
      - node_id: fps_marker
        type: fps_marker
        config:
          gate_id: saved_sample_fps
      - node_id: end
        type: end
    edges:
      - [start, fps_guard]
      - [fps_guard, sync_top_lidar]
      - [fps_guard, sync_corner_lidars]
      - [fps_guard, sync_images]
      - [sync_top_lidar, top_lidar_motion]
      - [sync_corner_lidars, front_left_motion]
      - [sync_corner_lidars, front_right_motion]
      - [sync_corner_lidars, rear_left_motion]
      - [sync_corner_lidars, rear_right_motion]
      - [top_lidar_motion, aggregate_pointclouds]
      - [front_left_motion, aggregate_pointclouds]
      - [front_right_motion, aggregate_pointclouds]
      - [rear_left_motion, aggregate_pointclouds]
      - [rear_right_motion, aggregate_pointclouds]
      - [aggregate_pointclouds, save_xtreme1]
      - [sync_images, save_xtreme1]
      - [save_xtreme1, fps_marker]
      - [fps_marker, end]
