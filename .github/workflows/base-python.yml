name: Base Python installation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base-without-inference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install development mode without inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Confirm inference packages were not installed
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("ultralytics", "torch", "torchvision", "onnx", "onnxruntime"):
              assert importlib.util.find_spec(name) is None, name
          PY
      - name: Test base DAG and inference isolation
        run: |
          # Projection visualization tests currently fail against an unchanged
          # older tool API. Keep that independent issue out of the base-only
          # installation regression job.
          python -m pytest tests/unit -q --ignore=tests/unit/test_projection_diagnostics.py
          python -m pytest tests/functional -q
