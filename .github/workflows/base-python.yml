name: Base Python installation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base-without-inference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install base and test extras only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Confirm inference packages were not installed
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("ultralytics", "torch", "torchvision", "onnx", "onnxruntime"):
              assert importlib.util.find_spec(name) is None, name
          PY
      - name: Run unit and functional tests without inference dependencies
        run: |
          python -m pytest tests/unit -q
          python -m pytest tests/functional -q
