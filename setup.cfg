[metadata]
name = data-collect-dag
version = 0.5.1
description = ROS1-oriented data collection DAG demo runtime
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8,<3.9
install_requires =
    numpy>=1.17,<2
    PyYAML>=5.3,<7
    Pillow>=7,<11
    rospkg>=1.4,<2

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    data_collect_dag = data_collect_dag.cli:main

[options.extras_require]
base =
opencv =
    opencv-python>=4.2,<4.12
yolo =
    ultralytics>=8.4,<9
    opencv-python>=4.2,<4.12
# Jetson wheels are supplied and constrained explicitly by the installer.
yolo-arm =
    ultralytics>=8.4,<9
    opencv-python>=4.2,<4.12
    psutil==6.1.1
dev =
    pytest>=7,<9
yolo-dev =
    ultralytics>=8.4,<9
    opencv-python>=4.2,<4.12
    pytest>=7,<9
