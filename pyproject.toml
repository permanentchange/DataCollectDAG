[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-collect-dag"
version = "0.1.0"
description = "ROS1-oriented data collection DAG demo runtime"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "numpy>=1.17,<2",
    "PyYAML>=5.3,<7",
    "Pillow>=7,<11",
    "opencv-python>=4.5,<4.12",
    "rospkg>=1.4,<2",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.4,<9"]
yolo-export = ["ultralytics[export]>=8.4,<9"]
# These are opt-in; a plain install must never bring in inference runtimes.
# ONNX Runtime CPU/GPU distributions are alternatives, not joint dependencies.
onnx-cpu = [
    "onnx>=1.12,<1.18",
    "onnxruntime>=1.12,<1.20",
]
onnx-gpu = [
    "onnx>=1.12,<1.18",
    "onnxruntime-gpu>=1.12,<1.20",
]
tools = [
    "open3d>=0.18,<0.19",
    "tqdm>=4.60,<5",
]
test = ["pytest>=7,<9"]

[project.scripts]
data_collect_dag = "data_collect_dag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
